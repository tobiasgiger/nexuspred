# Render.com Blueprint for Fluxbridge (v5 platform, branch `main`).
# Deploy: Render Dashboard → New → Blueprint → pick this repo.
# Render injects $PORT (run.py binds 0.0.0.0:$PORT) and serves it over HTTPS:443,
# which is what TradingView webhooks require.
# Production is reachable on the custom domain https://bridge.hurenzone.ch
# (Render → service → Settings → Custom Domains + a CNAME at the DNS provider);
# the default https://nexuspred.onrender.com keeps working alongside it.
#
# Upgrading an existing v4 service: keep the service and its disk, just point its
# Branch at `main` — the database and settings are fully compatible. The v4.11
# line is preserved on branch `backup/v4.11.0` for rollback.
services:
  - type: web
    name: nexuspred
    runtime: python
    plan: starter            # always-on. The free plan sleeps after 15 min idle.
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz
    autoDeploy: true         # redeploy automatically on git push
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Persist the SQLite DB / tokens on the mounted disk below (survives deploys).
      # Never share one data directory between two running instances.
      - key: NEXUSPRED_DATA_DIR
        value: /var/data
      # Branch the "Updates" page reports (the self-updater itself is disabled on
      # Render — deploys come from git push).
      - key: NEXUSPRED_BRANCH
        value: main
      # Canonical public origin: webhook URLs in the dashboard and emailed
      # invite/reset links are always built on the custom domain.
      - key: NEXUSPRED_PUBLIC_URL
        value: https://bridge.hurenzone.ch
      # Pins the login-cookie signing key across deploys (auto-generated by Render).
      - key: SESSION_SECRET
        generateValue: true
      # Dashboard access is the built-in account login (first run: /setup).
      # Tradovate accounts are token-only and configured in the dashboard under
      # Settings → Tradovate Accounts; no credential or token env vars are needed.
    disk:
      name: nexuspred-data
      mountPath: /var/data
      sizeGB: 1
