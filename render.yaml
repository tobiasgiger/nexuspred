# Render.com Blueprint for Fluxbridge v5 (branch `v5`) — runs as its OWN service
# next to a `main` (v4) deployment: separate service, separate disk, separate URL.
# Deploy: Render Dashboard → New → Blueprint → pick this repo → branch v5.
# Render injects $PORT (run.py binds 0.0.0.0:$PORT) and serves it over HTTPS:443,
# which is what TradingView webhooks require.
services:
  - type: web
    name: nexuspred-v5
    runtime: python
    plan: starter            # always-on. The free plan sleeps after 15 min idle.
    branch: v5
    buildCommand: pip install -r requirements.txt
    startCommand: python run.py
    healthCheckPath: /healthz
    autoDeploy: true         # redeploy automatically on git push to v5
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      # Persist the SQLite DB / tokens on the mounted disk below (survives deploys).
      # Must NOT be shared with a v4 service — see README "Running v5 next to v4".
      - key: NEXUSPRED_DATA_DIR
        value: /var/data
      # The self-updater is disabled on Render (deploys come from git push), but
      # keep the branch consistent for the "Updates" page.
      - key: NEXUSPRED_BRANCH
        value: v5
      # Pins the login-cookie signing key across deploys (auto-generated by Render).
      - key: SESSION_SECRET
        generateValue: true
      # Dashboard access is the built-in account login (first run: /setup).
      # Tradovate accounts are token-only and configured in the dashboard under
      # Settings → Tradovate Accounts; no credential or token env vars are needed.
    disk:
      name: nexuspred-v5-data
      mountPath: /var/data
      sizeGB: 1
