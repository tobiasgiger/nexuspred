name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"   # weekly dependency audit (Mondays 06:17 UTC)
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install
        run: python -m pip install -q -r requirements-dev.txt
      - name: Byte-compile
        run: python -m compileall -q app run.py
      - name: Tests
        env:
          PYTHONWARNINGS: error::DeprecationWarning
        run: python -m pytest -q --junitxml=pytest.xml
      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-${{ matrix.python }}
          path: pytest.xml
          retention-days: 7

  frontend:
    name: Frontend syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Syntax-check every ES module
        run: |
          set -e
          for f in $(find static/js -name '*.js'); do node --check "$f"; done
      - name: Manifest is valid JSON
        run: |
          if [ -f static/manifest.webmanifest ]; then node -e "JSON.parse(require('fs').readFileSync('static/manifest.webmanifest','utf8'))"; fi

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: pip-audit (known CVEs in pinned requirements)
        run: |
          python -m pip install -q pip-audit
          pip-audit -r requirements.txt --progress-spinner off --strict
