<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reset password · Fluxbridge</title>
  <style>
    :root { --bg:#0b0e14; --card:#161c28; --border:#232c3d; --text:#e6ebf2; --dim:#8a96a8; --accent:#4f8cff; --accent2:#1f6feb; --red:#ff5c5c; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background: radial-gradient(1200px 500px at 50% -10%, rgba(79,140,255,0.10), transparent), var(--bg);
      color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif; }
    .box { width:380px; max-width:92vw; background:var(--card); border:1px solid var(--border);
      border-radius:14px; padding:30px 26px; box-shadow:0 10px 40px rgba(0,0,0,0.4); }
    .head { text-align:center; margin-bottom:20px; }
    .logo { font-size:38px; color:var(--accent); filter:drop-shadow(0 0 10px rgba(79,140,255,0.5)); }
    h1 { font-size:20px; margin:12px 0 2px; }
    .sub { color:var(--dim); font-size:12.5px; }
    label { display:block; color:var(--dim); font-size:12.5px; margin-bottom:12px; }
    input { width:100%; margin-top:5px; background:var(--bg); border:1px solid var(--border); color:var(--text);
      padding:10px 11px; border-radius:8px; font-size:14px; }
    input:focus { outline:none; border-color:var(--accent); }
    button { width:100%; margin-top:6px; background:var(--accent2); border:1px solid var(--accent2); color:#fff;
      padding:11px; border-radius:9px; font-size:14px; font-weight:600; cursor:pointer; }
    button:hover { background:var(--accent); }
    .err { margin-bottom:16px; color:var(--red); font-size:13px; background:rgba(255,92,92,0.1);
      border:1px solid rgba(255,92,92,0.35); border-radius:8px; padding:9px 11px; }
    .note { margin-top:16px; color:var(--dim); font-size:11.5px; text-align:center; }
    a { color:var(--accent); }
  </style>
</head>
<body>
  <div class="box">
    <div class="head">
      <div class="logo">◈</div>
      <h1>Set a new password</h1>
      <div class="sub">Fluxbridge</div>
    </div>
    {% if error %}<div class="err">{{ error }}</div>{% endif %}
    {% if valid_token %}
      <form method="post" action="/reset">
        <input type="hidden" name="token" value="{{ token }}" />
        <label>New password <input type="password" name="password" autocomplete="new-password" required minlength="8" autofocus /></label>
        <label>Confirm password <input type="password" name="password2" autocomplete="new-password" required minlength="8" /></label>
        <button type="submit">Set password</button>
      </form>
    {% else %}
      <div class="err">This reset link is invalid or has expired. Ask an admin for a new one.</div>
      <div class="note"><a href="/login">Back to sign in</a></div>
    {% endif %}
  </div>
</body>
</html>
