<!DOCTYPE html>
<html lang="{{ lang or 'en' }}" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="dark light" />
  <meta name="theme-color" content="#0b0e14" media="(prefers-color-scheme: dark)" />
  <meta name="theme-color" content="#f3f5f9" media="(prefers-color-scheme: light)" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="/static/icons/icon.svg" />
  <link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Fluxbridge" />
  <title>{% block title %}Fluxbridge{% endblock %}</title>
  <script nonce="{{ nonce }}">
    (function () {
      try {
        var t = localStorage.getItem("fb_theme");
        if (!t || t === "system") {
          t = window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
        }
        document.documentElement.dataset.theme = t;
      } catch (e) { /* ignore */ }
    })();
  </script>
  <link rel="stylesheet" href="/static/css/tokens.css" />
  <link rel="stylesheet" href="/static/css/auth.css" />
</head>
<body>
  <main class="auth">
    <div class="auth-box">
      <div class="auth-head">
        <div class="auth-logo" aria-hidden="true">◈</div>
        <h1>{% block heading %}Fluxbridge{% endblock %}</h1>
        <div class="auth-sub">{% block subheading %}{% endblock %}</div>
      </div>
      {% if error %}<div class="auth-err" role="alert">{{ error }}</div>{% endif %}
      {% block content %}{% endblock %}
    </div>
  </main>
</body>
</html>
